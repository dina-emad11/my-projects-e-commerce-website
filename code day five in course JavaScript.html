<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab Solutions</title>
</head>

<body>
    <h2>1. Login Form</h2>
    <form action="" method="get">
        <label>User Name:</label>
        <input type="text" name="username" value="Enter your user name here">
        <br><br>

        <label>Password:</label>
        <input type="password" name="password">
        <br><br>

        <input type="submit" value="login">
    </form>
    <div id="welcomeMessage"></div>
    <hr>
    <h2>2. Advertising Pop-up</h2>
    <a href="#" onclick="openAd()">Open Advertising Window</a>
    <br><br>
    <a href="#" onclick="closeAd()">Close Advertising Window</a>
    <hr>
    <h2>3. Navigation (Location Object)</h2>
    <button onclick="goToFacebook()">Open Facebook</button>
    <button onclick="goToPinterest()">Open Pinterest (Cannot Return)</button>
    <hr>
    <h2>4. Delayed Alert Demo</h2>
    <p>Wait for 3 seconds after loading the page to see the welcome alert.</p>
    <script src="Radwa.js"></script>
</body>

</html>
