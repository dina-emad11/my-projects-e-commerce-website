<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Web Assignment</title>
        <link rel="stylesheet" href="dina.css">
        <style>
            .none-bullet-list {
                list-style-type: none;
            }
            ul{
                list-style-type: none;
            }
            #linksbar li > span > a:hover{
                color: pink;
                background-color: red;
            }
            #content h2 + p{
                font-weight: bold;
                font-size: 12px;
            }
            #loginform {
                border: 2px dashed rgb(20, 70, 60);
            }
            input[type="text"] {
                background-color: white;
            }
            input[type="text"]:focus {
                background-color: yellow;
            }
            .tabled-bordered {
                display: table-cell;
                padding: 5px;
                border: 1px solid black;
            }
            span + p::after {
                content: " Read this";
                color: rgb(73, 32, 221);
            }
            #content p#aboutus {
                color: yellow;
            }
            p#aboutus {
                color: red;
            }
            p#aboutus {
                color: red !important;
            }
            .navbar {
                background-color: #333;
                overflow: hidden;
                position: -webkit-sticky;
                position: sticky;
                top: 0;
                width: 100%;
                z-index: 1000;
            }
            .navbar ul {
                list-style-type: none;
                margin: 0;
                padding: 0;
            }
            .navbar li {
                display: inline-block;
            }
            .navbar li a {
                display: block;
                color: white;
                text-align: center;
                padding: 14px 20px;
                text-decoration: none;
            }
            .navbar li a:hover {
                background-color: #4CAF50;
            }
            .main-container {
                padding-top: 50px;
            }
            .register-btn {
                width: 100%;
                border: none;
                padding: 15px;
                background-color: #4CAF50;
                color: white;
                font-size: 16px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
    <div class="navbar">
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#news">News</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </div>
    <div class="main-container">
        <div id="header">
            <h1>This is the page header</h1>
        </div>
        <div id="linksbar">
            <ul>
                <li><span><a href="#">link1</a></span></li>
                <li><span><a href="#">link2</a></span></li>
                <li><span><a href="#">link3</a></span></li>
            </ul>
        </div>
        <div id="content">
            <p id="aboutus">about us</p>
            <p>This is a paragraph. This is a paragraph. This is a paragraph.</p>
            <h2>Heading 2</h2>
            <p>This paragraph is bold and 12px because it is directly after h2.</p>
            <div id="loginform">
                <p>Login Form</p>
                <label for="username">Username:</label>
                <input type="text" id="username"><br><br>
                <label for="password">Password:</label>
                <input type="text" id="password">
            </div>
            <div id="titles">
                <p class="tabled-bordered">title1</p>
                <p class="tabled-bordered">title2</p>
                <p class="tabled-bordered">title3</p>
            </div>
            <button class="register-btn">Register Now</button>
        </div>
    </div>
